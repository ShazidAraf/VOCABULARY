document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n              <span style=\"color:oklch(52% 0.06 265);\">{{ newCountVal }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ newCountVal }}\" sc-camel-on-change=\"{{ onChangeNew }}\" style=\"width:100%;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:8px;\">\n              <span>Weak words<\u002Fspan>\n              <span style=\"color:oklch(64% 0.21 30);\">{{ weakCountVal }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ weakCountVal }}\" sc-camel-on-change=\"{{ onChangeWeak }}\" style=\"width:100%;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:8px;\">\n              <span>Mastered words<\u002Fspan>\n              <span style=\"color:oklch(62% 0.18 150);\">{{ masteredCountVal }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ masteredCountVal }}\" sc-camel-on-change=\"{{ onChangeMastered }}\" style=\"width:100%;\">\n          <\u002Fdiv>\n\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:oklch(90% 0.06 265); border-radius:12px; margin-top:4px;\">\n            <span style=\"font-size:13px; font-weight:600;\">Words per conversation<\u002Fspan>\n            <span style=\"font-size:18px; font-weight:700; font-family:'Source Serif 4',serif;\">{{ totalWords }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11.5px; color:oklch(52% 0.06 265); line-height:1.6;\">If a bucket runs short of eligible words, the gap is filled with New words.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ pressReset }}\" style=\"margin-top:32px; width:100%; padding:13px; border-radius:10px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11.5px; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer; border:1px solid oklch(64% 0.21 30); background:none; color:oklch(64% 0.21 30);\">{{ resetLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProgress }}\">\n      <div>\n        <a sc-camel-on-click=\"{{ goHome }}\" style=\"font-size:12px; cursor:pointer; text-decoration:none; white-space:nowrap; font-weight:600;\">← Home<\u002Fa>\n        <div style=\"font-family:'Source Serif 4',serif; font-style:italic; font-weight:600; font-size:23px; margin:14px 0 16px;\">Progress<\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;\">\n          <div style=\"background:oklch(90% 0.06 265); padding:14px; border-radius:12px;\">\n            <div style=\"font-size:22px; font-weight:700; font-family:'Source Serif 4',serif;\">{{ totalConversations }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:oklch(52% 0.06 265);\">conversations<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(90% 0.06 265); padding:14px; border-radius:12px;\">\n            <div style=\"font-size:22px; font-weight:700; font-family:'Source Serif 4',serif;\">{{ encounteredCount }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:oklch(52% 0.06 265);\">words encountered<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(64% 0.21 30 / 10%); padding:14px; border-radius:12px;\">\n            <div style=\"font-size:22px; font-weight:700; font-family:'Source Serif 4',serif; color:oklch(64% 0.21 30);\">{{ starredCount }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:oklch(52% 0.06 265);\">currently weak<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:oklch(62% 0.18 150 / 10%); padding:14px; border-radius:12px;\">\n            <div style=\"font-size:22px; font-weight:700; font-family:'Source Serif 4',serif; color:oklch(62% 0.18 150);\">{{ masteredCount }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:oklch(52% 0.06 265);\">mastered words<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"grid-column:1 / -1; background:oklch(62% 0.18 150 / 10%); padding:14px; border-radius:12px;\">\n            <div style=\"font-size:22px; font-weight:700; font-family:'Source Serif 4',serif; color:oklch(62% 0.18 150);\">{{ masteredWeakCount }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:oklch(52% 0.06 265);\">mastered weaknesses (once weak, now solid)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;\">\n          <div style=\"font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:oklch(52% 0.06 265); font-weight:600;\">Trends over time<\u002Fdiv>\n          <div style=\"display:flex; background:oklch(90% 0.06 265); border-radius:999px; padding:3px;\">\n            <button sc-camel-on-click=\"{{ setModeCumulative }}\" style=\"padding:5px 11px; font-size:10px; letter-spacing:0.04em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; font-weight:600; cursor:pointer; border:none; border-radius:999px; background:{{ cumulativeActiveBg }}; color:{{ cumulativeActiveColor }};\">Cumulative<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ setModePerDay }}\" style=\"padding:5px 11px; font-size:10px; letter-spacing:0.04em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; font-weight:600; cursor:pointer; border:none; border-radius:999px; background:{{ perDayActiveBg }}; color:{{ perDayActiveColor }};\">Per day<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11.5px; color:oklch(32% 0.14 275); font-weight:600; margin-bottom:6px;\">Mastered words<\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; gap:6px; height:68px; border-bottom:1px solid oklch(85% 0.05 265); padding-bottom:2px; margin-bottom:18px;\">\n          <sc-for list=\"{{ masteredBars }}\" as=\"bar\" hint-placeholder-count=\"7\">\n            <div style=\"width:9px; background:{{ bar.color }}; height:{{ bar.h }}px; border-radius:4px 4px 0 0; flex:1; max-width:16px;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11.5px; color:oklch(32% 0.14 275); font-weight:600; margin-bottom:6px;\">Mastered weaknesses (once weak, now solid)<\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; gap:6px; height:68px; border-bottom:1px solid oklch(85% 0.05 265); padding-bottom:2px; margin-bottom:18px;\">\n          <sc-for list=\"{{ masteredWeakBars }}\" as=\"bar\" hint-placeholder-count=\"7\">\n            <div style=\"width:9px; background:{{ bar.color }}; height:{{ bar.h }}px; border-radius:4px 4px 0 0; flex:1; max-width:16px;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11.5px; color:oklch(32% 0.14 275); font-weight:600; margin-bottom:6px;\">Weakness (currently marked)<\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; gap:6px; height:68px; border-bottom:1px solid oklch(85% 0.05 265); padding-bottom:2px; margin-bottom:24px;\">\n          <sc-for list=\"{{ weakBars }}\" as=\"bar\" hint-placeholder-count=\"7\">\n            <div style=\"width:9px; background:{{ bar.color }}; height:{{ bar.h }}px; border-radius:4px 4px 0 0; flex:1; max-width:16px;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:oklch(52% 0.06 265); font-weight:600; margin-bottom:10px;\">Weak words by category<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <sc-for list=\"{{ categoryBreakdown }}\" as=\"cat\" hint-placeholder-count=\"5\">\n            <div>\n              <div style=\"display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;\">\n                <span>{{ cat.label }}<\u002Fspan>\n                <span style=\"color:oklch(52% 0.06 265);\">{{ cat.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:6px; background:oklch(90% 0.06 265); border-radius:3px; overflow:hidden;\">\n                <div style=\"height:100%; width:{{ cat.pct }}%; background:{{ cat.color }};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"color:oklch(52% 0.06 265); font-size:13px; padding:40px;\">Loading your notebook…<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApiKeyModal }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; background:oklch(32% 0.14 275 / 50%); display:flex; align-items:center; justify-content:center; z-index:20; padding:20px;\">\n    <div style=\"width:100%; max-width:360px; background:oklch(99% 0.01 90); border-radius:16px; padding:26px; box-shadow:0 20px 50px oklch(32% 0.14 275 / 30%);\">\n      <div style=\"font-family:'Source Serif 4',serif; font-style:italic; font-weight:600; font-size:21px; margin-bottom:8px;\">Claude API key<\u002Fdiv>\n      <div style=\"font-size:12.5px; color:oklch(52% 0.06 265); line-height:1.5; margin-bottom:16px;\">Needed once per tab to generate AI conversations. It's kept only in this tab's session, never saved to the page itself.<\u002Fdiv>\n      <input type=\"password\" value=\"{{ apiKeyDraft }}\" sc-camel-on-change=\"{{ onApiKeyInput }}\" placeholder=\"sk-ant-...\" style=\"width:100%; box-sizing:border-box; padding:11px 13px; border:1px solid oklch(85% 0.05 265); border-radius:10px; font-family:'IBM Plex Mono',monospace; font-size:13px; margin-bottom:16px; background:oklch(94% 0.04 265); color:oklch(32% 0.14 275);\">\n      <div style=\"display:flex; gap:10px;\">\n        <button sc-camel-on-click=\"{{ closeApiKeyModal }}\" style=\"flex:1; padding:11px; border:1px solid oklch(85% 0.05 265); background:none; color:oklch(32% 0.14 275); font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; text-transform:uppercase; cursor:pointer; border-radius:10px;\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ saveApiKey }}\" style=\"flex:1; padding:11px; border:none; background:oklch(32% 0.14 275); color:oklch(99% 0.01 90); font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; text-transform:uppercase; cursor:pointer; border-radius:10px;\">Save<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ openWordData }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeFlashcard }}\" style=\"position:fixed; inset:0; background:oklch(32% 0.14 275 / 45%); display:flex; align-items:flex-end; justify-content:center; z-index:10;\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:100%; max-width:440px; background:oklch(99% 0.01 90); border-radius:20px 20px 0 0; padding:24px 26px 30px; box-shadow:0 -12px 34px oklch(32% 0.14 275 / 25%);\">\n      <div style=\"width:36px; height:4px; background:oklch(85% 0.05 265); border-radius:2px; margin:0 auto 20px;\"><\u002Fdiv>\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\">\n        <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:{{ openWordData.color }}; font-weight:700;\">{{ openWordData.categoryLabel }}<\u002Fdiv>\n        <a sc-camel-on-click=\"{{ closeFlashcard }}\" style=\"font-size:12px; cursor:pointer; color:oklch(52% 0.06 265); text-decoration:none; font-weight:600;\">close<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-family:'Source Serif 4',serif; font-style:italic; font-weight:600; font-size:28px; margin:10px 0 2px; color:oklch(32% 0.14 275);\">{{ openWordData.word }}<\u002Fdiv>\n      <div style=\"font-size:12px; color:oklch(52% 0.06 265); font-style:italic; margin-bottom:16px;\">{{ openWordData.register }}<\u002Fdiv>\n      <div style=\"font-size:14.5px; line-height:1.6; margin-bottom:12px;\">{{ openWordData.definition }}<\u002Fdiv>\n      <div style=\"font-size:14px; line-height:1.6; color:oklch(38% 0.02 260); border-left:2px solid oklch(85% 0.05 265); padding-left:12px; margin-bottom:20px;\">\"{{ openWordData.example }}\"<\u002Fdiv>\n      <div style=\"font-size:12px; color:oklch(52% 0.06 265); margin-bottom:14px;\">{{ openWordData.scoreLabel }}<\u002Fdiv>\n      <sc-if value=\"{{ openWordData.canMark }}\">\n        <button sc-camel-on-click=\"{{ openWordData.onToggle }}\" style=\"width:100%; padding:15px; border-radius:12px; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer; border:2px solid {{ openWordData.starButtonBorder }}; background:{{ openWordData.starButtonBg }}; color:{{ openWordData.starButtonColor }};\">{{ openWordData.starLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ openWordData.canMarkFalse }}\">\n        <div style=\"font-size:12px; color:oklch(52% 0.06 265); font-style:italic;\">You can mark this word next time it appears in a conversation.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:760}}\">\nclass Component extends DCLogic {\n  state = {\n    loaded: false,\n    memory: {},\n    convCounter: 0,\n    currentConv: null,\n    screen: 'home',\n    openWordId: null,\n    totalConversations: 0,\n    sessionLog: [],\n    mode: 'builtin',\n    apiLoading: false,\n    apiError: null,\n    apiKey: null,\n    apiKeyDraft: '',\n    showApiKeyModal: false,\n    chartMode: 'cumulative',\n    resetCount: 0,\n    history: [],\n    wordCounts: { newCount: 5, weakCount: 3, masteredCount: 2 }\n  };\n\n  categoryLabels = {\n    tone: 'Tone & Personality',\n    connector: 'Spoken Connector',\n    reaction: 'Casual Reaction',\n    idiom: 'Idiom / Workplace',\n    hedging: 'Hedging / Softening'\n  };\n\n  categoryColors = {\n    tone: { solid: 'oklch(60% 0.19 40)', bg: 'oklch(60% 0.19 40 / 20%)' },\n    connector: { solid: 'oklch(58% 0.18 230)', bg: 'oklch(58% 0.18 230 / 20%)' },\n    reaction: { solid: 'oklch(60% 0.20 340)', bg: 'oklch(60% 0.20 340 / 20%)' },\n    idiom: { solid: 'oklch(58% 0.17 110)', bg: 'oklch(58% 0.17 110 / 20%)' },\n    hedging: { solid: 'oklch(56% 0.18 280)', bg: 'oklch(56% 0.18 280 / 20%)' }\n  };\n\n  async componentDidMount() {\n    let mod;\n    try {\n      mod = await import(window.__resources ? window.__resources.vocabData : './wordcatalog-data.js');\n    } catch (e) {\n      console.error('Failed to load vocabulary data', e);\n      return;\n    }\n    this.vocabAll = mod.VOCAB;\n    this.templates = mod.TEMPLATES;\n    this.frames = mod.FRAMES;\n    this.vocabById = {};\n    this.vocabAll.forEach(v => { this.vocabById[v.id] = v; });\n\n    let saved = null;\n    try {\n      const raw = localStorage.getItem('wordcatalog_v1');\n      if (raw) saved = JSON.parse(raw);\n    } catch (e) {}\n\n    const memory = {};\n    this.vocabAll.forEach(v => {\n      const old = saved && saved.memory && saved.memory[v.id];\n      if (old && 'score' in old) memory[v.id] = old;\n      else if (old) memory[v.id] = { score: old.starred ? 1 : 0, everWeak: !!old.starred, shown: old.shown || 0, lastConvIdx: old.lastConvIdx != null ? old.lastConvIdx : -99 };\n      else memory[v.id] = { score: 0, everWeak: false, shown: 0, lastConvIdx: -99 };\n    });\n\n    let apiKey = null;\n    try { apiKey = sessionStorage.getItem('wordcatalog_api_key'); } catch (e) {}\n\n    this.setState({\n      loaded: true,\n      memory,\n      convCounter: (saved && saved.convCounter) || 0,\n      totalConversations: (saved && saved.totalConversations) || 0,\n      sessionLog: (saved && saved.sessionLog) || [],\n      mode: (saved && saved.mode) || 'builtin',\n      history: (saved && saved.history) || [],\n      wordCounts: (saved && saved.wordCounts) || { newCount: 5, weakCount: 3, masteredCount: 2 },\n      apiKey\n    });\n  }\n\n  onApiKeyInput = (e) => this.setState({ apiKeyDraft: e.target.value });\n\n  saveApiKey = () => {\n    const key = this.state.apiKeyDraft.trim();\n    if (!key) return;\n    try { sessionStorage.setItem('wordcatalog_api_key', key); } catch (e) {}\n    this.setState({ apiKey: key, apiKeyDraft: '', showApiKeyModal: false, apiError: null });\n  };\n\n  closeApiKeyModal = () => {\n    this.setState({ showApiKeyModal: false });\n    if (!this.state.apiKey) this.setMode('builtin');\n  };\n\n  persist() {\n    const { memory, convCounter, totalConversations, sessionLog, mode, history, wordCounts } = this.state;\n    try {\n      localStorage.setItem('wordcatalog_v1', JSON.stringify({ memory, convCounter, totalConversations, sessionLog, mode, history, wordCounts }));\n    } catch (e) {}\n  }\n\n  undoLastSession = () => {\n    const history = [...this.state.history];\n    if (!history.length) return;\n    const last = history.pop();\n    this.setState({\n      memory: last.memory,\n      convCounter: last.convCounter,\n      totalConversations: last.totalConversations,\n      sessionLog: last.sessionLog,\n      history,\n      currentConv: null,\n      screen: 'home',\n      openWordId: null\n    }, () => this.persist());\n  };\n\n  setMode = (mode) => this.setState({ mode, apiError: null }, () => this.persist());\n\n  setChartMode = (chartMode) => this.setState({ chartMode });\n\n  setWordCount = (key, value) => {\n    this.setState(s => ({ wordCounts: { ...s.wordCounts, [key]: value } }), () => this.persist());\n  };\n\n  pressReset = () => {\n    const n = this.state.resetCount + 1;\n    if (n >= 5) {\n      const memory = {};\n      this.vocabAll.forEach(v => { memory[v.id] = { score: 0, everWeak: false, shown: 0, lastConvIdx: -99 }; });\n      try { localStorage.removeItem('wordcatalog_v1'); } catch (e) {}\n      this.setState({\n        memory,\n        convCounter: 0,\n        currentConv: null,\n        screen: 'home',\n        openWordId: null,\n        totalConversations: 0,\n        sessionLog: [],\n        history: [],\n        resetCount: 0\n      });\n    } else {\n      this.setState({ resetCount: n });\n    }\n  };\n\n  shuffle(arr) {\n    return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);\n  }\n\n  pickWordsForConversation(memory) {\n    let { newCount, weakCount, masteredCount } = this.state.wordCounts;\n    let total = newCount + weakCount + masteredCount;\n    if (total <= 0) { newCount = 5; weakCount = 3; masteredCount = 2; total = 10; }\n    const newPool = this.shuffle(this.vocabAll.filter(v => memory[v.id].score === 0));\n    const weakPool = this.shuffle(this.vocabAll.filter(v => memory[v.id].score > 0));\n    const masteredPool = this.shuffle(this.vocabAll.filter(v => memory[v.id].score < 0));\n    const picked = [];\n    const used = new Set();\n    const takeFrom = (pool, n) => {\n      let c = 0;\n      for (const v of pool) {\n        if (c >= n) break;\n        if (used.has(v.id)) continue;\n        picked.push(v); used.add(v.id); c++;\n      }\n    };\n    takeFrom(newPool, newCount);\n    takeFrom(weakPool, weakCount);\n    takeFrom(masteredPool, masteredCount);\n    if (picked.length < total) takeFrom(newPool, total);\n    if (picked.length < total) {\n      const rest = this.shuffle(this.vocabAll.filter(v => !used.has(v.id)));\n      takeFrom(rest, total);\n    }\n    return this.shuffle(picked);\n  }\n\n  renderSlotText(v) {\n    const list = v.category === 'idiom' ? this.frames['idiom_' + (v.usage || 'verb')] : this.frames[v.category];\n    const chosen = list[Math.floor(Math.random() * list.length)];\n    const idx = chosen.indexOf('{W}');\n    const pre = chosen.slice(0, idx);\n    const post = chosen.slice(idx + 3);\n    let word = v.word;\n    if (idx === 0) word = word.charAt(0).toUpperCase() + word.slice(1);\n    return { pre, word, post };\n  }\n\n  updateSessionLog(memory) {\n    const mastered = Object.values(memory).filter(m => m.score < 0).length;\n    const masteredWeak = Object.values(memory).filter(m => m.score < 0 && m.everWeak).length;\n    const weak = Object.values(memory).filter(m => m.score > 0).length;\n    const today = new Date().toISOString().slice(0, 10);\n    const log = [...this.state.sessionLog];\n    const last = log[log.length - 1];\n    if (last && last.date === today) {\n      log[log.length - 1] = { date: today, mastered, masteredWeak, weak };\n    } else {\n      log.push({ date: today, mastered, masteredWeak, weak });\n    }\n    return log.slice(-14);\n  }\n\n  generateConversation = () => {\n    if (this.state.apiLoading) return;\n    if (this.state.mode === 'api') {\n      if (!this.state.apiKey) { this.setState({ showApiKeyModal: true }); return; }\n      this.generateConversationApi();\n      return;\n    }\n    this.generateConversationBuiltin();\n  };\n\n  generateConversationBuiltin = () => {\n    const { memory, convCounter, totalConversations: prevTotal, sessionLog: prevLog, history } = this.state;\n    const newHistory = [...history, { memory, convCounter, totalConversations: prevTotal, sessionLog: prevLog }].slice(-3);\n    const nextConvIdx = convCounter + 1;\n    const tplChoice = this.templates[Math.floor(Math.random() * this.templates.length)];\n    const newMemory = { ...memory };\n    const targets = this.pickWordsForConversation(newMemory);\n\n    const lines = targets.map((v, i) => {\n      const rec = { ...newMemory[v.id] };\n      rec.shown = rec.shown + 1;\n      rec.lastConvIdx = nextConvIdx;\n      rec.score = Math.max(rec.score - 1, -1);\n      newMemory[v.id] = rec;\n      const { pre, word, post } = this.renderSlotText(v);\n      return { speaker: i % 2 === 0 ? 'native' : 'you', pre, word, post, wordId: v.id, convIdx: nextConvIdx, marked: false };\n    });\n\n    const totalConversations = this.state.totalConversations + 1;\n    const sessionLog = this.updateSessionLog(newMemory);\n    this.setState({\n      memory: newMemory,\n      convCounter: nextConvIdx,\n      currentConv: { title: tplChoice.title, lines },\n      screen: 'conversation',\n      totalConversations,\n      sessionLog,\n      history: newHistory\n    }, () => this.persist());\n  };\n\n  generateConversationApi = async () => {\n    const { memory, convCounter, totalConversations: prevTotal, sessionLog: prevLog, history } = this.state;\n    const newHistory = [...history, { memory, convCounter, totalConversations: prevTotal, sessionLog: prevLog }].slice(-3);\n    const nextConvIdx = convCounter + 1;\n    const scenario = this.templates[Math.floor(Math.random() * this.templates.length)].title;\n    const newMemory = { ...memory };\n    const targets = this.pickWordsForConversation(newMemory);\n    if (!targets.length) return;\n    if (!this.state.apiKey) { this.setState({ showApiKeyModal: true }); return; }\n\n    this.setState({ apiLoading: true, apiError: null });\n\n    targets.forEach(v => {\n      const rec = { ...newMemory[v.id] };\n      rec.shown = rec.shown + 1;\n      rec.lastConvIdx = nextConvIdx;\n      rec.score = Math.max(rec.score - 1, -1);\n      newMemory[v.id] = rec;\n    });\n\n    const wordList = targets.map(v => `\"${v.word}\" (${v.category}, meaning: ${v.definition})`).join('; ');\n    const prompt = 'Write a natural spoken-English dialogue (' + Math.max(targets.length, 6) + '-' + (Math.max(targets.length, 6) + 6) + ' lines) between \"You\" and \"Native speaker\" set in this scenario: ' + scenario +\n      '. It must read like realistic spoken conversation, not a list of vocabulary sentences. Weave in each of these words/phrases exactly once, wrapped in double asterisks like **word**: ' + wordList +\n      '. Return ONLY valid JSON, no markdown fences, no commentary, in this exact shape: {\"title\": \"...\", \"lines\": [{\"speaker\": \"you\", \"text\": \"...\"}, {\"speaker\": \"native\", \"text\": \"...\"}]}';\n\n    try {\n      const resp = await fetch('https://api.anthropic.com/v1/messages', {\n        method: 'POST',\n        headers: {\n          'content-type': 'application/json',\n          'x-api-key': this.state.apiKey,\n          'anthropic-version': '2023-06-01',\n          'anthropic-dangerous-direct-browser-access': 'true'\n        },\n        body: JSON.stringify({ model: 'claude-haiku-4-5', max_tokens: 1400, messages: [{ role: 'user', content: prompt }] })\n      });\n      if (!resp.ok) {\n        if (resp.status === 401 || resp.status === 403) {\n          try { sessionStorage.removeItem('wordcatalog_api_key'); } catch (e2) {}\n          this.setState({ apiLoading: false, apiKey: null, showApiKeyModal: true, apiError: 'That API key was rejected. Please re-enter it.' });\n          return;\n        }\n        throw new Error('API error ' + resp.status);\n      }\n      const data = await resp.json();\n      const raw = (data.content && data.content[0] && data.content[0].text) || '';\n      let jsonStr = raw.trim().replace(/^```(?:json)?/, '').replace(/```$/, '').trim();\n      if (!jsonStr.startsWith('{')) {\n        const m = jsonStr.match(/\\{[\\s\\S]*\\}/);\n        if (m) jsonStr = m[0];\n      }\n      const parsed = JSON.parse(jsonStr);\n      const wordByLower = {};\n      targets.forEach(v => { wordByLower[v.word.toLowerCase()] = v; });\n      const cleanMarkers = (s) => s.replace(/\\*\\*(.*?)\\*\\*/g, '$1');\n\n      const lines = (parsed.lines || []).map(l => {\n        const text = String(l.text || '');\n        const m = text.match(/\\*\\*(.+?)\\*\\*/);\n        if (m) {\n          const matchedWord = wordByLower[m[1].toLowerCase()];\n          const idx = text.indexOf(m[0]);\n          const pre = cleanMarkers(text.slice(0, idx));\n          const post = cleanMarkers(text.slice(idx + m[0].length));\n          if (matchedWord) {\n            return { speaker: l.speaker === 'native' ? 'native' : 'you', pre, word: m[1], post, wordId: matchedWord.id, convIdx: nextConvIdx, marked: false };\n          }\n          return { speaker: l.speaker === 'native' ? 'native' : 'you', pre: pre + m[1] + post, word: '', post: '', wordId: null };\n        }\n        return { speaker: l.speaker === 'native' ? 'native' : 'you', pre: cleanMarkers(text), word: '', post: '', wordId: null };\n      });\n\n      const totalConversations = this.state.totalConversations + 1;\n      const sessionLog = this.updateSessionLog(newMemory);\n      this.setState({\n        memory: newMemory,\n        convCounter: nextConvIdx,\n        currentConv: { title: parsed.title || scenario, lines },\n        screen: 'conversation',\n        totalConversations,\n        sessionLog,\n        history: newHistory,\n        apiLoading: false\n      }, () => this.persist());\n    } catch (e) {\n      console.error(e);\n      this.setState({ apiLoading: false, apiError: 'Could not reach the AI. Try again, or switch to Built-in mode.' });\n    }\n  };\n\n  toggleWordMark = (wordId, convIdx) => {\n    this.setState(s => {\n      const rec = { ...s.memory[wordId] };\n      if (rec.lastConvIdx !== convIdx) return s;\n      let lines = s.currentConv ? s.currentConv.lines : null;\n      if (lines) {\n        lines = lines.map(l => {\n          if (l.wordId === wordId && l.convIdx === convIdx) {\n            const newMarked = !l.marked;\n            rec.score += newMarked ? 2 : -2;\n            if (newMarked) rec.everWeak = true;\n            return { ...l, marked: newMarked };\n          }\n          return l;\n        });\n      }\n      const memory = { ...s.memory, [wordId]: rec };\n      const sessionLog = this.updateSessionLog(memory);\n      const currentConv = lines ? { ...s.currentConv, lines } : s.currentConv;\n      return { memory, sessionLog, currentConv };\n    }, () => this.persist());\n  };\n\n  openWord = (wordId) => this.setState({ openWordId: wordId });\n  closeFlashcard = () => this.setState({ openWordId: null });\n  goTo = (screen) => this.setState({ screen, openWordId: null });\n\n  renderVals() {\n    const { loaded, memory, screen, currentConv, openWordId, totalConversations, sessionLog } = this.state;\n    if (!loaded) return { loaded: false, notLoaded: true };\n\n    const isHome = screen === 'home';\n    const isConversation = screen === 'conversation' && !!currentConv;\n    const isWeak = screen === 'weak';\n    const isProgress = screen === 'progress';\n    const isSettings = screen === 'settings';\n\n    const starredCount = Object.values(memory).filter(m => m.score > 0).length;\n    const masteredCount = Object.values(memory).filter(m => m.score < 0).length;\n    const masteredWeakCount = Object.values(memory).filter(m => m.score < 0 && m.everWeak).length;\n    const encounteredCount = Object.values(memory).filter(m => m.shown > 0).length;\n\n    let lines = [];\n    if (currentConv) {\n      lines = currentConv.lines.map((ln, i) => {\n        const cat = ln.wordId ? this.vocabById[ln.wordId].category : null;\n        const colors = cat ? this.categoryColors[cat] : null;\n        return {\n          key: 'l' + i,\n          isYou: ln.speaker === 'you',\n          isNative: ln.speaker === 'native',\n          pre: ln.pre,\n          word: ln.word,\n          post: ln.post,\n          hasWord: !!ln.wordId,\n          color: colors ? colors.solid : 'oklch(52% 0.06 265)',\n          bg: colors ? colors.bg : 'transparent',\n          markRing: ln.marked ? '0 0 0 2px oklch(64% 0.21 30)' : 'none',\n          onOpen: ln.wordId ? (() => this.openWord(ln.wordId)) : undefined\n        };\n      });\n    }\n\n    const weakList = Object.keys(memory).filter(id => memory[id].score > 0 && this.vocabById[id]).map(id => {\n      const v = this.vocabById[id];\n      return {\n        id,\n        word: v.word,\n        register: v.register,\n        categoryLabel: this.categoryLabels[v.category],\n        color: this.categoryColors[v.category].solid,\n        scoreLabel: 'score ' + memory[id].score,\n        onOpen: () => this.openWord(id)\n      };\n    }).sort((a, b) => a.categoryLabel.localeCompare(b.categoryLabel) || a.word.localeCompare(b.word));\n\n    const chartMode = this.state.chartMode;\n    const series = (key) => {\n      const raw = sessionLog.map(s => s[key] || 0);\n      if (chartMode === 'cumulative') return raw;\n      return raw.map((v, i) => v - (i > 0 ? raw[i - 1] : 0));\n    };\n    const buildBars = (key, color) => {\n      const vals = series(key);\n      const maxV = Math.max(1, ...vals.map(v => Math.abs(v)));\n      return (vals.length ? vals : [0]).map((v) => ({\n        h: Math.max(2, Math.round((Math.abs(v) / maxV) * 88)),\n        color\n      }));\n    };\n    const masteredBars = buildBars('mastered', 'oklch(62% 0.18 150)');\n    const masteredWeakBars = buildBars('masteredWeak', 'oklch(52% 0.06 265)');\n    const weakBars = buildBars('weak', 'oklch(64% 0.21 30)');\n    const isCumulative = chartMode === 'cumulative';\n\n    const catKeys = ['tone', 'connector', 'reaction', 'idiom', 'hedging'];\n    const rawBreakdown = catKeys.map(k => ({\n      key: k,\n      count: this.vocabAll.filter(v => v.category === k && memory[v.id] && memory[v.id].score > 0).length\n    }));\n    const maxCat = Math.max(1, ...rawBreakdown.map(r => r.count));\n    const categoryBreakdown = rawBreakdown.map(r => ({\n      key: r.key,\n      label: this.categoryLabels[r.key],\n      color: this.categoryColors[r.key].solid,\n      count: r.count,\n      pct: Math.round((r.count / maxCat) * 100)\n    }));\n\n    let openWordData = null;\n    if (openWordId && this.vocabById[openWordId]) {\n      const v = this.vocabById[openWordId];\n      const m = memory[openWordId];\n      const colors = this.categoryColors[v.category];\n      const activeLine = currentConv ? currentConv.lines.find(l => l.wordId === openWordId && l.convIdx === m.lastConvIdx) : null;\n      const canMark = !!activeLine;\n      const marked = activeLine ? activeLine.marked : false;\n      openWordData = {\n        word: v.word,\n        register: v.register,\n        definition: v.definition,\n        example: v.example,\n        categoryLabel: this.categoryLabels[v.category],\n        color: colors.solid,\n        scoreLabel: m.score < 0 ? ('Mastered' + (m.everWeak ? ' (was weak)' : '')) : (m.score > 0 ? ('Marked weak · score ' + m.score) : 'Not yet marked'),\n        canMark,\n        canMarkFalse: !canMark,\n        starLabel: marked ? '★ marked as weak in this conversation — tap to unmark' : '☆ mark as weak in this conversation',\n        starButtonBorder: marked ? 'oklch(64% 0.21 30)' : 'oklch(32% 0.14 275)',\n        starButtonBg: marked ? 'oklch(64% 0.21 30)' : 'transparent',\n        starButtonColor: marked ? 'oklch(99% 0.01 90)' : 'oklch(32% 0.14 275)',\n        onToggle: canMark ? (() => this.toggleWordMark(openWordId, m.lastConvIdx)) : undefined\n      };\n    }\n\n    const isApiMode = this.state.mode === 'api';\n    const generateButtonLabel = this.state.apiLoading ? 'Writing conversation…' : 'Generate New Conversation';\n    const { newCount, weakCount, masteredCount: masteredCnt } = this.state.wordCounts;\n    const totalWords = newCount + weakCount + masteredCnt;\n\n    return {\n      loaded: true,\n      notLoaded: false,\n      isHome, isConversation, isWeak, isProgress, isSettings,\n      isApiMode,\n      generateButtonLabel,\n      generateDisabled: this.state.apiLoading,\n      newConvoCursor: this.state.apiLoading ? 'default' : 'pointer',\n      newConvoOpacity: this.state.apiLoading ? '0.5' : '1',\n      apiError: this.state.apiError,\n      builtinActiveBg: isApiMode ? 'transparent' : 'oklch(32% 0.14 275)',\n      builtinActiveColor: isApiMode ? 'oklch(32% 0.14 275)' : 'oklch(99% 0.01 90)',\n      apiActiveBg: isApiMode ? 'oklch(32% 0.14 275)' : 'transparent',\n      apiActiveColor: isApiMode ? 'oklch(99% 0.01 90)' : 'oklch(32% 0.14 275)',\n      setModeBuiltin: () => this.setMode('builtin'),\n      setModeApi: () => { this.setMode('api'); if (!this.state.apiKey) this.setState({ showApiKeyModal: true }); },\n      showApiKeyModal: this.state.showApiKeyModal,\n      apiKeyDraft: this.state.apiKeyDraft,\n      onApiKeyInput: this.onApiKeyInput,\n      saveApiKey: this.saveApiKey,\n      closeApiKeyModal: this.closeApiKeyModal,\n      convTitle: currentConv ? currentConv.title : '',\n      lines,\n      weakList,\n      weakCount: weakList.length,\n      weakCountZero: weakList.length === 0,\n      totalConversations,\n      encounteredCount,\n      starredCount,\n      masteredCount,\n      masteredWeakCount,\n      masteredBars,\n      masteredWeakBars,\n      weakBars,\n      isCumulative,\n      setModeCumulative: () => this.setChartMode('cumulative'),\n      setModePerDay: () => this.setChartMode('per-day'),\n      cumulativeActiveBg: isCumulative ? 'oklch(32% 0.14 275)' : 'transparent',\n      cumulativeActiveColor: isCumulative ? 'oklch(99% 0.01 90)' : 'oklch(32% 0.14 275)',\n      perDayActiveBg: isCumulative ? 'transparent' : 'oklch(32% 0.14 275)',\n      perDayActiveColor: isCumulative ? 'oklch(32% 0.14 275)' : 'oklch(99% 0.01 90)',\n      resetLabel: this.state.resetCount === 0 ? 'Reset all progress' : ('Press ' + (5 - this.state.resetCount) + ' more time' + (5 - this.state.resetCount === 1 ? '' : 's') + ' to confirm'),\n      pressReset: this.pressReset,\n      canUndo: this.state.history.length > 0,\n      undoLabel: 'Undo last session (' + this.state.history.length + ' left)',\n      undoLastSession: this.undoLastSession,\n      categoryBreakdown,\n      openWordData,\n      newCountVal: newCount,\n      weakCountVal: weakCount,\n      masteredCountVal: masteredCnt,\n      totalWords,\n      onChangeNew: (e) => this.setWordCount('newCount', parseInt(e.target.value, 10)),\n      onChangeWeak: (e) => this.setWordCount('weakCount', parseInt(e.target.value, 10)),\n      onChangeMastered: (e) => this.setWordCount('masteredCount', parseInt(e.target.value, 10)),\n      generateConversation: this.generateConversation,\n      goHome: () => this.goTo('home'),\n      goWeak: () => this.goTo('weak'),\n      goProgress: () => this.goTo('progress'),\n      goSettings: () => this.goTo('settings'),\n      closeFlashcard: this.closeFlashcard,\n      stopClick: (e) => e.stopPropagation()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
